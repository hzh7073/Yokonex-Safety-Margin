services:
  dglab-relay:
    build:
      context: .
      args:
        DGLAB_SERVER_COMMIT: 497645525a9ec4e159587d3f2c463d7399ba17e5
    container_name: dglab-v4-relay
    restart: unless-stopped
    expose:
      - "9998"
    networks:
      - proxy-admin
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy-admin:
    external: true
    name: proxy-admin_default
